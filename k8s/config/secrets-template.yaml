apiVersion: v1
kind: Secret
metadata:
  name: learnhub-secrets
  namespace: learnhub
type: Opaque
data:
  # INSTRUCTIONS: Base64 encode your values before applying.
  # Command example: echo -n 'my-password' | base64
  
  # PostgreSQL
  POSTGRES_USER: ""       # e.g., bHB1c2Vy (lpuser)
  POSTGRES_PASSWORD: ""   # e.g., bHBwd2QxMjM= (lppwd123)
  
  # MongoDB
  MONGO_USER: ""          # e.g., bHBtb25nb3VzZXI= (lpmongouser)
  MONGO_PASSWORD: ""      # e.g., bHBtb25nb3B3ZDEyMw== (lpmongopwd123)
  
  # Redis
  REDIS_PASSWORD: ""      # e.g., bHByZWRpc3B3ZDEyMw== (lpredispwd123)
  
  # MinIO
  MINIO_ROOT_USER: ""     # e.g., YWRtaW4= (admin)
  MINIO_ROOT_PASSWORD: "" # e.g., c3VwZXJzZWNyZXQ= (supersecret)
  
  # Auth / JWT
  SECRET_KEY: ""          # Used by FastAPI
  JWT_SECRET: ""          # Used by Express
  JWT_EXPIRES_IN: "N2Q="  # 7d (b64)
  
  # n8n SMTP
  N8N_USER: ""            # e.g., YWRtaW4= (admin)
  N8N_PASSWORD: ""        # e.g., cGFzc3dvcmQ= (password)
  SMTP_HOST: ""           # e.g., c210cC5nbWFpbC5jb20=
  SMTP_USER: ""
  SMTP_PASS: ""
  SMTP_SENDER: ""         # e.g., YWRtaW5AeW91cnBsYXRmb3JtLmNvbQ==
