apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: learnhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: learnhub
      service: analytics-service
  template:
    metadata:
      labels:
        app: learnhub
        service: analytics-service
    spec:
      containers:
      - name: analytics-service
        image: analytics-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8003
        env:
        - name: DATABASE_URL
          value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@redis:6379/2"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: learnhub-secrets
              key: SECRET_KEY
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: learnhub-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: learnhub-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: learnhub-config
              key: POSTGRES_DB
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: learnhub-secrets
              key: REDIS_PASSWORD

---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: learnhub
spec:
  ports:
  - port: 8003
    targetPort: 8003
  selector:
    app: learnhub
    service: analytics-service
