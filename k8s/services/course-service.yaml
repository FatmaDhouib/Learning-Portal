apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-service
  namespace: learnhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: learnhub
      service: course-service
  template:
    metadata:
      labels:
        app: learnhub
        service: course-service
    spec:
      containers:
      - name: course-service
        image: course-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
        env:
        - name: DATABASE_URL
          value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: learnhub-secrets
              key: SECRET_KEY
        - name: MINIO_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: learnhub-config
              key: MINIO_ENDPOINT
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: learnhub-secrets
              key: MINIO_ROOT_USER
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: learnhub-secrets
              key: MINIO_ROOT_PASSWORD
        - name: MINIO_BUCKET
          valueFrom:
            configMapKeyRef:
              name: learnhub-config
              key: MINIO_BUCKET
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: learnhub-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: learnhub-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: learnhub-config
              key: POSTGRES_DB
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: learnhub-secrets
              key: REDIS_PASSWORD

---
apiVersion: v1
kind: Service
metadata:
  name: course-service
  namespace: learnhub
spec:
  ports:
  - port: 8001
    targetPort: 8001
  selector:
    app: learnhub
    service: course-service
