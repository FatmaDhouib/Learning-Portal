apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: learnhub
spec:
  serviceName: "postgres"
  replicas: 1
  selector:
    matchLabels:
      app: learnhub
      service: postgres
  template:
    metadata:
      labels:
        app: learnhub
        service: postgres
    spec:
      nodeSelector:
        node-role.kubernetes.io/database: "true"
      tolerations:
      - key: "database"
        operator: "Equal"
        value: "heavy"
        effect: "NoSchedule"
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: learnhub-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: learnhub-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: learnhub-config
              key: POSTGRES_DB
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: postgres-init
          mountPath: /docker-entrypoint-initdb.d/init.sql
          subPath: init.sql
        readinessProbe:
          exec:
            command:
            - "sh"
            - "-c"
            - "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc
      - name: postgres-init
        configMap:
          name: postgres-init

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: learnhub
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: learnhub
    service: postgres
