apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-pvc
  namespace: learnhub
  labels:
    app: learnhub
    service: ollama
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ollama
  namespace: learnhub
spec:
  serviceName: "ollama"
  replicas: 1
  selector:
    matchLabels:
      app: learnhub
      service: ollama
  template:
    metadata:
      labels:
        app: learnhub
        service: ollama
    spec:
      nodeSelector:
        node-role.kubernetes.io/database: "true"
      tolerations:
      - key: "database"
        operator: "Equal"
        value: "heavy"
        effect: "NoSchedule"
      containers:
      - name: ollama
        image: ollama/ollama:latest
        command: ["sh", "-c", "ollama serve & sleep 5 && ollama pull qwen2.5:0.5b && wait"]
        ports:
        - containerPort: 11434
        volumeMounts:
        - name: ollama-data
          mountPath: /root/.ollama
        readinessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 15
          periodSeconds: 10
      volumes:
      - name: ollama-data
        persistentVolumeClaim:
          claimName: ollama-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: learnhub
spec:
  ports:
  - port: 11434
    targetPort: 11434
  selector:
    app: learnhub
    service: ollama
