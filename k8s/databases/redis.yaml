apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: learnhub
spec:
  serviceName: "redis"
  replicas: 1
  selector:
    matchLabels:
      app: learnhub
      service: redis
  template:
    metadata:
      labels:
        app: learnhub
        service: redis
    spec:
      nodeSelector:
        node-role.kubernetes.io/database: "true"
      tolerations:
      - key: "database"
        operator: "Equal"
        value: "heavy"
        effect: "NoSchedule"
      containers:
      - name: redis
        image: redis:7-alpine
        command: ["sh", "-c", "redis-server --requirepass ${REDIS_PASSWORD}"]
        ports:
        - containerPort: 6379
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: learnhub-secrets
              key: REDIS_PASSWORD
        volumeMounts:
        - name: redis-data
          mountPath: /data
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - "redis-cli -a ${REDIS_PASSWORD} ping"
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: learnhub
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: learnhub
    service: redis
