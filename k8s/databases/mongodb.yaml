apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: learnhub
spec:
  serviceName: "mongodb"
  replicas: 1
  selector:
    matchLabels:
      app: learnhub
      service: mongodb
  template:
    metadata:
      labels:
        app: learnhub
        service: mongodb
    spec:
      nodeSelector:
        node-role.kubernetes.io/database: "true"
      tolerations:
      - key: "database"
        operator: "Equal"
        value: "heavy"
        effect: "NoSchedule"
      containers:
      - name: mongodb
        image: mongo:7
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: learnhub-secrets
              key: MONGO_USER
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: learnhub-secrets
              key: MONGO_PASSWORD
        - name: MONGO_INITDB_DATABASE
          valueFrom:
            configMapKeyRef:
              name: learnhub-config
              key: MONGO_DB
        volumeMounts:
        - name: mongo-data
          mountPath: /data/db
        readinessProbe:
          exec:
            command:
            - mongosh
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: mongo-data
        persistentVolumeClaim:
          claimName: mongodb-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: learnhub
spec:
  ports:
  - port: 27017
    targetPort: 27017
  selector:
    app: learnhub
    service: mongodb
