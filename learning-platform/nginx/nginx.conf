worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ─────────────────────────────────────────
    # Upstream definitions
    # ─────────────────────────────────────────
    upstream frontend {
        server learning-frontend:3000;
    }
    upstream course_service {
        server course-service:8001;
    }
    upstream user_service {
        server user-service:8002;
    }
    upstream analytics_service {
        server analytics-service:8003;
    }
    upstream ai_tutor_service {
        server ai-tutor-service:8004;
    }

    # ─────────────────────────────────────────
    # Main server block
    # ─────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        # CORS headers for API routes
        add_header Access-Control-Allow-Origin  * always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Accept' always;

        # Handle preflight
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # ── Course Service ──────────────────
        location /api/courses/ {
            proxy_pass         http://course_service/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── User Service ────────────────────
        location /api/users/ {
            proxy_pass         http://user_service/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Analytics Service ───────────────
        location /api/analytics/ {
            proxy_pass         http://analytics_service/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── AI Tutor Service ────────────────
        location /api/ai/ {
            proxy_pass         http://ai_tutor_service/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;  # AI responses can take longer
        }

        # ── Frontend (catch-all) ────────────
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        'upgrade';
            proxy_set_header   Host              $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
